appId: com.taxone.desktop
productName: Quework Desktop

directories:
  output: dist

files:
  - src/**/*
  - assets/**/*
  - node_modules/**/*
  - package.json

protocols:
  - name: Quework Desktop
    schemes:
      - taxone-desktop

win:
  target: nsis
  icon: assets/icon.ico

nsis:
  # IDENTIFIER, not branding. The web app links straight at this exact
  # filename — abr9t/taxone routes/web.php:540 points the download button at
  # releases/latest/download/TaxOne-Desktop-Setup.exe — so renaming it 404s
  # that button the moment a release is tagged. If it ever does change, both
  # repos have to ship in the same release.
  artifactName: "TaxOne-Desktop-Setup.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Quework Desktop
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico

# Where electron-builder uploads (CI only — every npm script passes
# --publish never) and what it writes into the packaged
# resources/app-update.yml, which tells electron-updater where to look. The
# repo is public: no token is configured here and none ships in the app.
# releaseType: draft — a release reaches installed apps only once a person
# publishes it. See ARCHITECTURE.md, "Releases and auto-update".
publish:
  provider: github
  owner: abr9t
  repo: taxone-desktop
  releaseType: draft
