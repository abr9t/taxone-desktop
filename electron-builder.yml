appId: com.taxone.desktop
productName: Quework Desktop

directories:
  output: dist

files:
  - src/**/*
  - assets/**/*
  - node_modules/**/*
  - package.json

protocols:
  - name: Quework Desktop
    schemes:
      - taxone-desktop

win:
  target: nsis
  icon: assets/icon.ico

nsis:
  artifactName: "Quework-Desktop-Setup.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Quework Desktop
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
